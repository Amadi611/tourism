<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Serendib Journeys</title>

    <!-- Bootstrap 5 (design + responsive layout) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Our own extra styles -->
    <link href="css/style.css" rel="stylesheet">
    <link href="css/auth.css" rel="stylesheet">
</head>
<body>

<!-- Navbar is injected by layout.js -->
<div id="site-navbar"></div>

<main class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-11 col-sm-9 col-md-7 col-lg-5">

                <div class="card auth-card shadow-sm border-0">
                    <div class="card-body p-4 p-md-5">

                        <div class="text-center mb-4">
                            <i class="bi bi-airplane-fill text-primary fs-1"></i>
                            <h3 class="fw-bold mt-2">Create an Account</h3>
                            <p class="text-muted">Join us to book and manage your Sri Lanka tours</p>
                        </div>

                        <div id="register-alert" class="alert d-none" role="alert"></div>

                        <form id="register-form" novalidate>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="firstName" class="form-label">First Name</label>
                                    <input type="text" class="form-control" id="firstName" placeholder="John" required>
                                    <div class="invalid-feedback d-block error-text" id="firstName-error"></div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="lastName" class="form-label">Last Name</label>
                                    <input type="text" class="form-control" id="lastName" placeholder="Doe" required>
                                    <div class="invalid-feedback d-block error-text" id="lastName-error"></div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="registerEmail" class="form-label">Email address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control" id="registerEmail" placeholder="you@example.com" required>
                                </div>
                                <div class="invalid-feedback d-block error-text" id="registerEmail-error"></div>
                            </div>

                            <div class="mb-3">
                                <label for="phone" class="form-label">Phone Number</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white"><i class="bi bi-telephone"></i></span>
                                    <input type="tel" class="form-control" id="phone" placeholder="+94 7X XXX XXXX" required>
                                </div>
                                <div class="invalid-feedback d-block error-text" id="phone-error"></div>
                            </div>

                            <div class="mb-3">
                                <label for="registerPassword" class="form-label">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="registerPassword" placeholder="At least 8 characters" required>
                                    <button class="btn btn-outline-secondary toggle-password" type="button" data-target="registerPassword">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                                <div class="invalid-feedback d-block error-text" id="registerPassword-error"></div>
                            </div>

                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">Confirm Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white"><i class="bi bi-lock-fill"></i></span>
                                    <input type="password" class="form-control" id="confirmPassword" placeholder="Re-enter your password" required>
                                    <button class="btn btn-outline-secondary toggle-password" type="button" data-target="confirmPassword">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                                <div class="invalid-feedback d-block error-text" id="confirmPassword-error"></div>
                            </div>

                            <div class="form-check mb-4">
                                <input class="form-check-input" type="checkbox" id="agreeTerms" required>
                                <label class="form-check-label small" for="agreeTerms">
                                    I agree to the <a href="#" class="text-decoration-none">Terms of Service</a> and <a href="#" class="text-decoration-none">Privacy Policy</a>
                                </label>
                                <div class="invalid-feedback d-block error-text" id="agreeTerms-error"></div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                                <span class="btn-text">Create Account</span>
                                <span class="spinner-border spinner-border-sm ms-2 d-none" role="status" aria-hidden="true"></span>
                            </button>
                        </form>

                        <p class="text-center mt-4 mb-0">
                            Already have an account? <a href="login.html" class="fw-semibold text-decoration-none">Log in</a>
                        </p>

                    </div>
                </div>

            </div>
        </div>
    </div>
</main>

<!-- Footer is injected by layout.js -->
<div id="site-footer"></div>

<!-- Bootstrap JavaScript (mobile menu, etc.) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Our data + scripts -->
<script src="js/data.js"></script>
<script src="js/layout.js"></script>
<script src="js/auth.js"></script>
<script src="js/register.js"></script>
</body>
</html>
