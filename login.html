<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Serendib Journeys</title>

    <!-- Bootstrap 5 (design + responsive layout) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Our own extra styles -->
    <link href="css/style.css" rel="stylesheet">
    <link href="css/auth.css" rel="stylesheet">
</head>
<body>

<!-- Navbar is injected by layout.js -->
<div id="site-navbar"></div>

<main class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-11 col-sm-8 col-md-6 col-lg-4">

                <div class="card auth-card shadow-sm border-0">
                    <div class="card-body p-4 p-md-5">

                        <div class="text-center mb-4">
                            <i class="bi bi-airplane-fill text-primary fs-1"></i>
                            <h3 class="fw-bold mt-2">Welcome Back</h3>
                            <p class="text-muted">Log in to book your next Sri Lanka adventure</p>
                        </div>

                        <!-- Alert box for errors / messages -->
                        <div id="login-alert" class="alert d-none" role="alert"></div>

                        <form id="login-form" novalidate>
                            <div class="mb-3">
                                <label for="loginEmail" class="form-label">Email address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control" id="loginEmail" placeholder="you@example.com" required>
                                </div>
                                <div class="invalid-feedback d-block error-text" id="loginEmail-error"></div>
                            </div>

                            <div class="mb-3">
                                <label for="loginPassword" class="form-label">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="loginPassword" placeholder="Enter your password" required>
                                    <button class="btn btn-outline-secondary toggle-password" type="button" data-target="loginPassword">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                                <div class="invalid-feedback d-block error-text" id="loginPassword-error"></div>
                            </div>

                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="rememberMe">
                                    <label class="form-check-label" for="rememberMe">Remember me</label>
                                </div>
                                <a href="#" class="small text-decoration-none">Forgot password?</a>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                                <span class="btn-text">Log In</span>
                                <span class="spinner-border spinner-border-sm ms-2 d-none" role="status" aria-hidden="true"></span>
                            </button>
                        </form>

                        <p class="text-center mt-4 mb-0">
                            Don't have an account? <a href="register.html" class="fw-semibold text-decoration-none">Register here</a>
                        </p>

                    </div>
                </div>

            </div>
        </div>
    </div>
</main>

<!-- Footer is injected by layout.js -->
<div id="site-footer"></div>

<!-- Bootstrap JavaScript (mobile menu, etc.) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Our data + scripts -->
<script src="js/data.js"></script>
<script src="js/layout.js"></script>
<script src="js/auth.js"></script>
<script src="js/login.js"></script>
</body>
</html>
