<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serendib Journeys - Tour Packages</title>

    <!-- Bootstrap 5 (design + responsive layout) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Our own extra styles -->
    <link href="css/style.css" rel="stylesheet">
    <link href="css/auth.css" rel="stylesheet">
</head>
<body>

<!-- Navbar is injected by layout.js -->
<div id="site-navbar"></div>

<main class="py-4">

    <!-- ==================== HERO BANNER ==================== -->
    <section class="hero text-center mb-5">
        <div class="container">
            <h1 class="display-4 fw-bold">Come to Sri Lanka - Discover Your Next Adventure</h1>
            <p class="lead">Handpicked tour packages across beautiful Ceylon</p>
            <div class="mt-4">
                <button class="btn btn-primary btn-lg me-2" data-bs-toggle="modal" data-bs-target="#authModal" data-auth-mode="login">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Login
                </button>
                <button class="btn btn-outline-primary btn-lg" data-bs-toggle="modal" data-bs-target="#authModal" data-auth-mode="register">
                    <i class="bi bi-person-plus me-2"></i>Register
                </button>
            </div>
        </div>
    </section>

    <div class="container">
        <h3 class="mb-4" id="packages">Our Tour Packages</h3>
        <div class="row g-4" id="package-grid">
            <!-- Cards are inserted here by home.js -->
        </div>
    </div>

</main>

<!-- ==================== AUTH MODAL ==================== -->
<div class="modal fade" id="authModal" tabindex="-1" aria-labelledby="authModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-0">
                <h5 class="modal-title fw-bold" id="authModalLabel">
                    <i class="bi bi-airplane-fill text-primary me-2"></i>
                    <span id="auth-title">Welcome Back</span>
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <!-- Alert box for errors / messages -->
                <div id="auth-alert" class="alert d-none" role="alert"></div>

                <!-- Login Form -->
                <form id="login-form" novalidate>
                    <div class="mb-3">
                        <label for="loginEmail" class="form-label">Email address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="loginEmail" placeholder="you@example.com" required>
                        </div>
                        <div class="invalid-feedback d-block error-text" id="loginEmail-error"></div>
                    </div>

                    <div class="mb-3">
                        <label for="loginPassword" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="loginPassword" placeholder="Enter your password" required>
                            <button class="btn btn-outline-secondary toggle-password" type="button" data-target="loginPassword">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                        <div class="invalid-feedback d-block error-text" id="loginPassword-error"></div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="rememberMe">
                            <label class="form-check-label" for="rememberMe">Remember me</label>
                        </div>
                        <a href="#" class="small text-decoration-none">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                        <span class="btn-text">Log In</span>
                        <span class="spinner-border spinner-border-sm ms-2 d-none" role="status" aria-hidden="true"></span>
                    </button>
                </form>

                <!-- Register Form -->
                <form id="register-form" class="d-none" novalidate>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="firstName" class="form-label">First Name</label>
                            <input type="text" class="form-control" id="firstName" placeholder="John" required>
                            <div class="invalid-feedback d-block error-text" id="firstName-error"></div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="lastName" class="form-label">Last Name</label>
                            <input type="text" class="form-control" id="lastName" placeholder="Doe" required>
                            <div class="invalid-feedback d-block error-text" id="lastName-error"></div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="registerEmail" class="form-label">Email address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="registerEmail" placeholder="you@example.com" required>
                        </div>
                        <div class="invalid-feedback d-block error-text" id="registerEmail-error"></div>
                    </div>

                    <div class="mb-3">
                        <label for="phone" class="form-label">Phone Number</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-telephone"></i></span>
                            <input type="tel" class="form-control" id="phone" placeholder="+94 7X XXX XXXX" required>
                        </div>
                        <div class="invalid-feedback d-block error-text" id="phone-error"></div>
                    </div>

                    <div class="mb-3">
                        <label for="registerPassword" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="registerPassword" placeholder="At least 8 characters" required>
                            <button class="btn btn-outline-secondary toggle-password" type="button" data-target="registerPassword">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                        <div class="invalid-feedback d-block error-text" id="registerPassword-error"></div>
                    </div>

                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">Confirm Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" class="form-control" id="confirmPassword" placeholder="Re-enter your password" required>
                            <button class="btn btn-outline-secondary toggle-password" type="button" data-target="confirmPassword">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                        <div class="invalid-feedback d-block error-text" id="confirmPassword-error"></div>
                    </div>

                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" id="agreeTerms" required>
                        <label class="form-check-label small" for="agreeTerms">
                            I agree to the <a href="#" class="text-decoration-none">Terms of Service</a> and <a href="#" class="text-decoration-none">Privacy Policy</a>
                        </label>
                        <div class="invalid-feedback d-block error-text" id="agreeTerms-error"></div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                        <span class="btn-text">Create Account</span>
                        <span class="spinner-border spinner-border-sm ms-2 d-none" role="status" aria-hidden="true"></span>
                    </button>
                </form>

                <!-- Toggle between login and register -->
                <div class="text-center mt-4">
                    <p class="mb-0" id="auth-toggle-text">
                        Don't have an account? 
                        <a href="#" class="fw-semibold text-decoration-none" id="auth-toggle-link">Register here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Footer is injected by layout.js -->
<div id="site-footer"></div>

<!-- Bootstrap JavaScript (mobile menu, etc.) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Our data + scripts -->
<script src="js/data.js"></script>
<script src="js/layout.js"></script>
<script src="js/home.js"></script>
<script src="js/auth-modal.js"></script>
</body>
</html>
